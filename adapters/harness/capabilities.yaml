# adapters/harness/capabilities.yaml — single source of truth for harness support.
#
# Consumers:
#   - scripts/gen-assets.ts renders this into adapters/harness/capabilities.generated.ts
#     (embedded in the compiled binary via the import graph; no yaml at runtime).
#   - adapters/harness/registry.ts loads the generated module + validates it.
#   - adapters/harness/generic.ts builds headless argv + workbench hook paths
#     from the declared capability; only genuinely inexpressible behavior should
#     need a harness-specific adapter.
#   - application/workspace/manifest.ts derives SKILL_PROJECTIONS from
#     workbench_projection (+ shared_workbench_projection).
#   - P5 scripts/check-harness-consistency.ts asserts code/docs/CI match this file.
#
# Adding a 5th/6th harness = adding an entry here; no production code change
# outside this file for the supported declarative behavior.
#
# Field semantics:
#   headless              — headless invocation prefix, or `null` when the harness is
#                           IDE-only (no CLI; never a cron harness).
#   argv_flags            — extra flags for the headless argv. The generic
#                           assembler emits output flags before permission flags.
#   sessions              — session events jspace wires (or plans to wire); `source`
#                           distinguishes hook / plugin / extension channels.
#   session_start         — where the session-start briefing hook is materialized:
#                           `path` is workbench-relative or `~`-expanded machine path,
#                           `format` is json/toml/file, `key` is the json/toml write
#                           point when applicable. file format means "file presence is
#                           the wiring signal" (e.g. Pi extension).
#   global_context        — how this harness loads the machine-global governance
#                           document. File-based kinds (`symlink`, `symlink-or-import`)
#                           require `path`; `manual`/`unverified` are explicit non-checks.
#                           `override_path` is Codex's higher-precedence override file.
#   mcp                   — `native: true` (harness-native MCP) or `via: <adapter>`
#                           (third-party extension channel, e.g. pi-mcp-adapter).
#   mcp_config            — where a harness keeps its gbrain MCP server config
#                           (path/format/server_key); consumed by `harness wire` +
#                           doctor's wiring check. `env_key` overrides the env
#                           field name (default "env"; opencode uses "environment").
#                           `writer` selects the constrained merge strategy used
#                           by `harness wire`; `path` may start with `~`
#                           (expanded per home dir).
#   workbench_projection  — workbench-relative skill projection dirs materialized by
#                           init/upgrade as directory symlinks to `.jspace/skills/`
#                           (copy only as a visible fallback when symlink is unavailable).
#   user_install          — user-level paths (doctor reports existence only; wired by
#                           `jspace skills install`, never by init/upgrade).
#   hook_format           — hook/plugin channel type, or `none` when the harness has
#                           no Claude-style hooks (values consumed by P2/P3/P5).
#   native_memory         — "none", or "full" when the harness has its own memory
#                           subsystem (gbrain stays authoritative — D1/B).
#   lifecycle             — 4-dimension grade (automated | best_effort | manual |
#                           unsupported). Grade semantics follow harnesses.md:
#                           automated = CI/test evidence; best_effort = mechanism
#                           exists but real trigger depends on the environment;
#                           manual = explicit user action; unsupported = no mechanism.
#   cron_harness_enum_value — value valid in cron.json `harness` (absent/null for
#                           IDE-only harnesses that cannot run headless).
#   supports_tool_restriction — true when argv_flags.permission is set and cron
#                           `--tools` / cron.json `tools` may restrict headless
#                           tool access; false = cron add/run must fail loud.
#   cron_env              — per-harness child env whitelist for headless cron
#                           spawns (SSOT for cronSpawnEnv); GBRAIN_* + base keys
#                           are always included; NODE_OPTIONS only when listed
#                           in allow_keys.
#   documented            — false for compatibility-only entries (codex) that have no
#                           harness-<name>.md doc (P5 assertion exemption).

schema_version: 1

# Machine-global governance source + the minimum heading topics doctor verifies.
# The prose contract lives in skills/harness-config/references/governance.md;
# repair remains the harness-config skill's responsibility.
global_governance:
  source: "~/.agents/AGENTS.md"
  required_headings:
    - "安全与隐私红线"
    - "决策原则"
    - "维护约定"

# Workbench-relative multi-harness projection shared by every harness. Complementary
# to per-harness dirs (workbench_projection) and the user-level ~/.agents/skills.
shared_workbench_projection:
  - .agents/skills

harnesses:
  claude:
    headless: ["claude", "-p"]
    argv_flags:
      permission: "--allowedTools"
      tools_value: "Bash,Read,Write,Edit,mcp__gbrain__*"
      output: "--output-format"
      output_value: "text"
    supports_tool_restriction: true
    cron_env:
      # CLAUDE_* covers subscription/OAuth tokens (e.g. CLAUDE_CODE_OAUTH_TOKEN);
      # ANTHROPIC_* covers API key + ANTHROPIC_BASE_URL proxy setups.
      allow_prefixes: ["ANTHROPIC_", "CLAUDE_"]
      allow_keys: []
    sessions:
      - { name: SessionStart, source: hook }
      - { name: UserPromptSubmit, source: hook }
      - { name: SessionEnd, source: hook }
    session_start: { path: ".claude/settings.json", format: json, key: "hooks.SessionStart" }
    global_context: { kind: symlink-or-import, path: "~/.claude/CLAUDE.md" }
    mcp: { native: true }
    mcp_config: { path: "~/.claude.json", format: json, server_key: "mcpServers.gbrain", writer: existing-server-env-json }
    workbench_projection: [".claude/skills"]
    user_install: []
    hook_format: claude_settings_json
    native_memory: none
    lifecycle:
      session_start: best_effort
      # B4: SessionEnd hook wired in the seed (docs/session-end-hooks.md). Stays
      # best_effort, never automated — Claude discards SessionEnd output, so the
      # reminder never reaches the session; the in-session surface is the
      # once-per-session `jspace context turn` write-back nudge.
      session_end: best_effort
      fallback: manual
      crash_recovery: best_effort
    cron_harness_enum_value: claude
    documented: true

  grok:
    headless: ["grok", "-p"]
    argv_flags:
      permission: "--allow"
      tools_value: "Bash(*)"
      output: "--output-format"
      output_value: "json"
    supports_tool_restriction: true
    cron_env:
      allow_prefixes: ["GROK_", "XAI_"]
      allow_keys: []
    sessions:
      - { name: SessionStart, source: hook }
      - { name: UserPromptSubmit, source: hook }
      - { name: PreCompact, source: hook }
      - { name: SessionEnd, source: hook }
    session_start: { path: ".grok/hooks/jspace.json", format: json, key: "hooks.SessionStart" }
    global_context: { kind: unverified }
    mcp: { native: true }
    mcp_config: { path: "~/.grok/config.toml", format: toml, server_key: "mcp_servers.gbrain", writer: existing-server-env-toml }
    workbench_projection: [".grok/skills"]
    user_install: []
    hook_format: grok_hooks_json
    native_memory: full
    lifecycle:
      session_start: best_effort
      session_end: best_effort
      fallback: manual
      crash_recovery: best_effort
    cron_harness_enum_value: grok
    documented: true

  opencode:
    # Unattended cron needs non-interactive tool approval; scope --auto to the
    # headless argv only. Interactive `opencode` keeps its normal prompts.
    headless: ["opencode", "run", "--auto"]
    argv_flags: {}
    supports_tool_restriction: false
    cron_env:
      allow_prefixes: ["OPENCODE_"]
      allow_keys: []
    sessions:
      # session.created injects the workbench context as a no-reply user message
      # (client.session.prompt with noReply: true) — real injection, not a
      # fire-and-forget spawn; compacting re-injects it at compaction time.
      - { name: session.created, source: plugin }
      - { name: session.idle, source: plugin }
      - { name: experimental.session.compacting, source: plugin }
    session_start: { path: ".opencode/plugins/jspace.ts", format: file }
    global_context: { kind: unverified }
    mcp: { native: true }
    # opencode MCP servers live under `mcp.<name>` with a local-server shape:
    # { type: "local", command: [bin, ...], enabled, environment } — `command` is an
    # array and env is named `environment` (vs claude/cursor/pi `command`+`args`/`env`),
    # so env_key must be "environment" for doctor's wiring check to find GBRAIN_SKILLS_DIR.
    mcp_config: { path: "~/.config/opencode/opencode.json", format: json, server_key: "mcp.gbrain", env_key: "environment", writer: merge-opencode-local }
    workbench_projection: [".opencode/skills"]
    user_install: []
    hook_format: opencode_plugin_ts
    native_memory: none
    lifecycle:
      session_start: best_effort
      session_end: manual
      fallback: manual
      crash_recovery: best_effort
    cron_harness_enum_value: opencode
    documented: true

  cursor:
    headless: null
    argv_flags: {}
    supports_tool_restriction: false
    cron_env:
      allow_prefixes: []
      allow_keys: []
    sessions:
      - { name: sessionStart, source: hook }
      - { name: sessionEnd, source: hook }
    session_start: { path: ".cursor/hooks.json", format: json, key: "hooks.sessionStart" }
    global_context: { kind: manual }
    mcp: { native: true }
    mcp_config: { path: "~/.cursor/mcp.json", format: json, server_key: "mcpServers.gbrain", writer: merge-json-server }
    workbench_projection: []
    user_install: []
    hook_format: cursor_hooks_json
    native_memory: none
    lifecycle:
      session_start: best_effort
      # B4: sessionEnd hook wired in the seed (docs/session-end-hooks.md). Same
      # boundary as claude — Cursor logs but does not use the response, so the
      # nudge lands on the turn hook, not here.
      session_end: best_effort
      fallback: manual
      crash_recovery: manual
    cron_harness_enum_value: null
    documented: true

  pi:
    headless: ["pi", "-p"]
    argv_flags: {}
    supports_tool_restriction: false
    cron_env:
      allow_prefixes: ["PI_"]
      allow_keys: []
    sessions:
      - { name: session_start, source: extension }
      - { name: before_agent_start, source: extension }
    session_start: { path: "~/.pi/agent/extensions/jspace/index.ts", format: file }
    global_context: { kind: symlink, path: "~/.pi/agent/AGENTS.md" }
    mcp: { via: pi_mcp_adapter }
    mcp_config: { path: "~/.pi/agent/mcp.json", format: json, server_key: "mcpServers.gbrain", writer: merge-json-server }
    workbench_projection: []
    user_install: ["~/.agents/skills"]
    hook_format: none
    native_memory: none
    lifecycle:
      session_start: best_effort
      session_end: manual
      fallback: manual
      crash_recovery: best_effort
    cron_harness_enum_value: pi
    documented: true

  codex:
    headless: ["codex", "exec"]
    argv_flags: {}
    supports_tool_restriction: false
    cron_env:
      allow_prefixes: ["OPENAI_", "CODEX_"]
      allow_keys: []
    sessions: []
    global_context: { kind: symlink, path: "~/.codex/AGENTS.md", override_path: "~/.codex/AGENTS.override.md" }
    mcp: { native: true }
    mcp_config: null
    workbench_projection: []
    user_install: []
    hook_format: none
    native_memory: none
    lifecycle:
      session_start: manual
      session_end: manual
      fallback: manual
      crash_recovery: best_effort
    cron_harness_enum_value: codex
    documented: false
