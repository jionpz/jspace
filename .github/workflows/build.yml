# Build JSpace CLI binaries on 3 OS x 2 arch, smoke-test each, and publish
# platform artifacts to a GitHub Release on tag pushes (v*).
# Runner labels per actions/runner-images (verified 2026-08-02):
#   macOS arm64 = macos-14 (default), x64 = macos-15-intel
#   Windows x64 = windows-latest, arm64 = windows-11-arm
#   Linux x64 = ubuntu-latest, arm64 = ubuntu-24.04-arm
name: build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: "jspace-${{ matrix.arch }} (${{ matrix.os }})"
    runs-on: "${{ matrix.os }}"
    # P3 (issue #7): cross-compile is network/compile heavy — cap it. Concurrency
    # groups by tag+matrix cell so a stale push never cancels a publishing tag's
    # in-flight compile (cancel-in-progress false = queue, not kill).
    timeout-minutes: 30
    concurrency:
      group: build-${{ github.ref }}-${{ matrix.os }}-${{ matrix.arch }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          # x64 uses -baseline targets: bun's default x64 build requires AVX and
          # crashes on older CPUs; baseline is compatible (arm64 needs no baseline).
          - { os: ubuntu-latest,     arch: x64,   target: bun-linux-x64-baseline,    artifact: jspace-linux-x64 }
          - { os: ubuntu-24.04-arm,  arch: arm64, target: bun-linux-arm64,           artifact: jspace-linux-arm64 }
          - { os: macos-14,          arch: arm64, target: bun-darwin-arm64,          artifact: jspace-macos-arm64 }
          - { os: macos-15-intel,    arch: x64,   target: bun-darwin-x64-baseline,   artifact: jspace-macos-x64 }
          - { os: windows-latest,    arch: x64,   target: bun-windows-x64,           artifact: jspace-windows-x64.exe }
          - { os: windows-11-arm,    arch: arm64, target: bun-windows-arm64,         artifact: jspace-windows-arm64.exe }
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          # Pin bun so cross-compile runtimes match the lockfile.
          bun-version: 1.3.14

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: "Generate version before assets (bundle_version must embed the tag)"
        shell: bash
        env:
          # Tag builds embed the release version; non-tag builds fall back to
          # git describe (no tags fetched) -> 0.0.0-dev.
          JSPACE_BUILD_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          bun run scripts/gen-version.ts
          if [ -n "$JSPACE_BUILD_VERSION" ]; then
            EXPECTED="${JSPACE_BUILD_VERSION#v}"
            grep -q "\"$EXPECTED\"" cli/version.generated.ts || { echo "version.generated.ts does not embed $EXPECTED (tag $JSPACE_BUILD_VERSION)"; exit 1; }
          fi

      - name: Regenerate embedded assets
        run: bun run scripts/gen-assets.ts

      - name: Compile standalone binary
        shell: bash
        run: |
          # windows-x64 uses non-baseline target: the bun-windows-x64-baseline
          # runtime download is consistently blocked on GitHub Windows runners.
          # AVX-less (baseline) windows binary is built locally via `bun run build:all`.
          for i in 1 2 3; do
            bun build --compile cli/main.ts --minify --target=${{ matrix.target }} --outfile ${{ matrix.artifact }} && break
            echo "compile attempt $i failed; clearing bun runtime cache and retrying..."
            rm -rf "$HOME/.bun/install/cache" 2>/dev/null || true
            sleep 5
          done

      - name: Smoke test (compiled binary)
        shell: bash
        run: |
          ./${{ matrix.artifact }} --version
          ./${{ matrix.artifact }} init --force /tmp/jspace-smoke
          ./${{ matrix.artifact }} doctor --dir /tmp/jspace-smoke

      # Cron CRUD smoke (B3) — asserts the scheduler write / read-back / uninstall
      # loop against the REAL platform scheduler, plus the doctor rows that
      # depend on it (cron.not_installed before install, cron.stale_task for an
      # orphaned task, neither after a clean uninstall).
      # Deliberately NOT asserted: that a task actually fires. crond/launchd
      # timing on a hosted runner is not a trustworthy signal, and a scheduled
      # run would need a real harness CLI. Real firing stays in the manual matrix
      # (docs/PLATFORMS.md「真机验证台账」).
      - name: Cron CRUD smoke (Linux crontab)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          BIN="$PWD/${{ matrix.artifact }}"
          WB=/tmp/jspace-cron-smoke
          # Runner images ship cron, but never assume it: a missing crontab would
          # otherwise turn this assertion into a silent skip.
          if ! command -v crontab >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq cron
          fi
          rm -rf "$WB"
          "$BIN" init --force "$WB"
          "$BIN" cron add smoke-test --dir "$WB" --schedule "0 21 * * *" --harness claude --prompt "ci cron crud smoke"

          before=$("$BIN" doctor --dir "$WB" --json 2>/dev/null)
          [[ "$before" == *'"cron.not_installed"'* ]] || { echo "::error::enabled cron before install must report cron.not_installed"; exit 1; }

          plan=$("$BIN" cron install --dry-run --dir "$WB")
          [[ "$plan" == *"[create]"* ]] || { echo "::error::cron install --dry-run planned no create op"; exit 1; }

          "$BIN" cron install --dir "$WB"
          ct=$(crontab -l)
          [[ "$ct" == *"jspace crons"* ]] || { echo "::error::managed crontab block missing after cron install"; exit 1; }
          [[ "$ct" == *"smoke-test"* ]] || { echo "::error::smoke-test line missing from the managed crontab block"; exit 1; }

          status=$("$BIN" cron status smoke-test --dir "$WB")
          [[ "$status" == *"never run"* ]] || { echo "::error::cron status did not report 'never run'"; exit 1; }

          after=$("$BIN" doctor --dir "$WB" --json 2>/dev/null)
          [[ "$after" != *'"cron.not_installed"'* ]] || { echo "::error::doctor still reports cron.not_installed after install"; exit 1; }
          # non-downgrade side of issue #10: a real host is never "unverifiable"
          [[ "$after" != *"_unverifiable"* ]] || { echo "::error::real host must not degrade cron health to unverifiable"; exit 1; }

          again=$("$BIN" cron install --dir "$WB")
          [[ "$again" == *"up to date"* ]] || { echo "::error::second cron install is not a no-op (reconciliation drift)"; exit 1; }

          "$BIN" cron remove smoke-test --dir "$WB"
          orphan=$("$BIN" doctor --dir "$WB" --json 2>/dev/null)
          [[ "$orphan" == *'"cron.stale_task"'* ]] || { echo "::error::orphaned scheduler task must report cron.stale_task"; exit 1; }

          "$BIN" cron uninstall --dir "$WB"
          gone=$(crontab -l 2>/dev/null || true)
          [[ "$gone" != *"jspace crons"* ]] || { echo "::error::managed crontab block survived cron uninstall"; exit 1; }

          "$BIN" doctor --dir "$WB"
          echo "cron CRUD smoke OK (linux / crontab)"

      - name: Cron CRUD smoke (Windows schtasks)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = Join-Path $PWD '${{ matrix.artifact }}'
          $wb  = Join-Path $env:RUNNER_TEMP 'jspace-cron-smoke'
          if (Test-Path -LiteralPath $wb) { Remove-Item -LiteralPath $wb -Recurse -Force }
          & $bin init --force $wb
          & $bin cron add smoke-test --dir $wb --schedule "0 21 * * *" --harness claude --prompt "ci cron crud smoke"

          $before = (& $bin doctor --dir $wb --json) -join "`n"
          if ($before -notmatch 'cron\.not_installed') { throw "enabled cron before install must report cron.not_installed" }

          $plan = (& $bin cron install --dry-run --dir $wb) -join "`n"
          if ($plan -notmatch '\[create\]') { throw "cron install --dry-run planned no create op" }

          & $bin cron install --dir $wb
          $tasks = (schtasks /query /fo csv /nh) -join "`n"
          if ($tasks -notmatch 'JSpaceCron_') { throw "no JSpaceCron_* task registered after cron install" }

          $status = (& $bin cron status smoke-test --dir $wb) -join "`n"
          if ($status -notmatch 'never run') { throw "cron status did not report 'never run'" }

          $after = (& $bin doctor --dir $wb --json) -join "`n"
          if ($after -match 'cron\.not_installed') { throw "doctor still reports cron.not_installed after install" }

          $again = (& $bin cron install --dir $wb) -join "`n"
          if ($again -notmatch 'up to date') { throw "second cron install is not a no-op (reconciliation drift)" }

          & $bin cron remove smoke-test --dir $wb
          $orphan = (& $bin doctor --dir $wb --json) -join "`n"
          if ($orphan -notmatch 'cron\.stale_task') { throw "orphaned scheduled task must report cron.stale_task" }

          & $bin cron uninstall --dir $wb
          $gone = (schtasks /query /fo csv /nh) -join "`n"
          if ($gone -match 'JSpaceCron_') { throw "scheduled task survived cron uninstall" }

          # Windows scheduling subset: a dom-pinned (MONTHLY-shaped) schedule has
          # no schtasks mapping and must be refused at add time, not silently
          # accepted into a cron that can never install.
          $rejected = $false
          $out = ''
          try {
            $out = (& $bin cron add win-monthly --dir $wb --schedule "0 21 1 * *" --harness claude --prompt "unsupported" 2>&1) -join "`n"
            if ($LASTEXITCODE -ne 0) { $rejected = $true }
          } catch {
            $out = $_.Exception.Message
            $rejected = $true
          }
          if (-not $rejected) { throw "dom-pinned schedule must be rejected on Windows, got: $out" }
          if ($out -notmatch 'not supported on Windows') { throw "unsupported-schedule error text changed: $out" }

          & $bin doctor --dir $wb
          Write-Host "cron CRUD smoke OK (windows / schtasks)"

      # macOS stays plan-only: launchd agents are bound to a real user GUI
      # session, which a hosted runner does not reliably provide, so a bootstrap
      # there would be flaky rather than informative. This still exercises
      # schedule parsing + plist content compilation + reconciliation planning.
      - name: Cron plan smoke (macOS, no launchd mutation)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          BIN="$PWD/${{ matrix.artifact }}"
          WB=/tmp/jspace-cron-smoke
          rm -rf "$WB"
          "$BIN" init --force "$WB"
          "$BIN" cron add smoke-test --dir "$WB" --schedule "0 21 * * *" --harness claude --prompt "ci cron crud smoke"
          plan=$("$BIN" cron install --dry-run --dir "$WB")
          [[ "$plan" == *"[create]"* ]] || { echo "::error::cron install --dry-run planned no create op"; exit 1; }
          "$BIN" doctor --dir "$WB"
          echo "cron plan smoke OK (macos / launchd install left to the manual matrix)"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: "${{ matrix.artifact }}"
          path: "${{ matrix.artifact }}"
          if-no-files-found: error

  # R5: the scheduler convergence / identity / machine-truth decoder /
  # import-boundary unit tests run on CI (pure tests, no real scheduler) —
  # `bun test` must be green before any tag builds are published.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install deps
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Tests (scheduler convergence, state contracts, import boundary)
        run: bun test
      - name: Skills / generated-asset freshness
        run: bun run scripts/check-skills.ts
      - name: Manifest source integrity (committed)
        run: bun run scripts/check-manifest-integrity.ts
      - name: Harness consistency (capabilities.yaml ↔ code/docs/templates)
        run: bun run scripts/check-harness-consistency.ts

  release:
    # R6 (issue #7 P0): tag publishes must pass the full test gate (tsc + bun
    # test + check-skills), not just the cross-compile build.
    needs: [build, test]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      # Generate checksums for the install scripts to verify against. Run
      # inside artifacts/ so line filenames are bare asset names (no prefix),
      # and before upload so checksums.txt is not hashed into itself.
      - name: Generate checksums.txt
        run: |
          cd artifacts
          sha256sum * > checksums.txt
          echo "--- checksums.txt ---"
          cat checksums.txt

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*

  # True one-click-install smoke on each OS: run the real install script
  # against the just-published release, assert --version, re-install for
  # idempotency, then uninstall and assert the binary is gone.
  verify-install:
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: "${{ matrix.os }}"
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    asset: jspace-linux-x64,        bin: jspace }
          - { os: macos-14,         asset: jspace-macos-arm64,      bin: jspace }
          - { os: windows-latest,   asset: jspace-windows-x64.exe,  bin: jspace.exe }
    env:
      # Pin the version being verified (avoid releases/latest eventual-consistency
      # on the very first release); install script defaults to latest otherwise.
      # `latest` in the scripts now maps to the /releases/latest/download redirect;
      # the pin keeps this smoke test deterministic regardless of that alias's timing.
      JSPACE_VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5

      - name: Forbid /download/latest (regression guard)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          # GitHub 的 /releases/download/<tag> 会把 latest 当字面 tag（404）；
          # 正确的 latest 下载写法是 /releases/latest/download/<asset>。
          if grep -Rn "download/latest" install/ cli/update.ts; then
            echo "::error::禁止把 latest 拼进 /download/<tag>（会被 GitHub 当字面 tag 返回 404）"
            exit 1
          fi
          echo "OK: 未发现 download/latest 字面拼接"

      - name: Install / idempotent / uninstall (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash install/install.sh --no-rc
          export PATH="$HOME/.local/bin:$PATH"
          jspace --version
          bash install/install.sh --no-rc        # idempotent: must not fail
          bash install/install.sh --uninstall
          ! [ -e "$HOME/.local/bin/${{ matrix.bin }}" ] && echo "binary removed"

      - name: Install / idempotent / uninstall (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./install/install.ps1
          $env:Path = "$env:LOCALAPPDATA\jspace\bin;" + $env:Path
          jspace --version
          ./install/install.ps1                   # idempotent: must not fail
          ./install/install.ps1 -Uninstall
          if (Test-Path "$env:LOCALAPPDATA\jspace\bin\${{ matrix.bin }}") { throw "binary not removed" }

