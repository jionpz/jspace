# PR/push quality gate: type-check, unit tests, generated-asset freshness,
# contract decode and temp-workbench integration. Runs on every push to main
# and every PR (independent of the tag-driven build/release matrix).
name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Type check
        run: bunx tsc --noEmit

      - name: Unit tests
        run: bun test

      - name: Office extraction tests
        run: python3 skills/asset-ingest/scripts/office-extract.test.py

      - name: Asset freshness (gen-assets must be a no-op)
        run: |
          bun run scripts/gen-assets.ts
          git diff --exit-code -- cli/assets.generated.ts cli/manifest.generated.ts

      - name: Init integration (temp workbench)
        run: |
          bun run cli/main.ts init /tmp/jspace-verify
          bun run cli/main.ts doctor --dir /tmp/jspace-verify
          bun run cli/main.ts workspace diff --dir /tmp/jspace-verify
