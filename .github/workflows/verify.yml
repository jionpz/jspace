# PR/push quality gate: type-check, unit tests, generated-asset freshness,
# contract decode and temp-workbench integration. Runs on every push to main
# and every PR (independent of the tag-driven build/release matrix).
name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Type check
        run: bunx tsc --noEmit

      - name: Unit tests
        run: bun test

      - name: Cross-skill reference reachability
        run: bun test cli/assets-reachability.test.ts

      - name: Skill self-checks (C1–C4)
        run: bun run scripts/check-skills.ts

      - name: Office extraction tests
        run: python3 skills/asset-ingest/scripts/office-extract.test.py

      - name: Layer-routing / markitdown fallback regression
        run: python3 skills/asset-ingest/scripts/extract.test.py

      - name: Asset freshness (gen-assets must be a no-op, incl. skills manifest)
        run: |
          bun run scripts/gen-assets.ts
          git diff --exit-code -- cli/assets.generated.ts cli/manifest.generated.ts cli/skills.generated.ts

      # P1-1: catch a bumped package.json with a stale cli/version.generated.ts.
      # Not a full `gen-version && diff` — dev builds embed `git describe`'s
      # commit delta (`1.0.11-2-g…`), which legitimately differs from the
      # committed release form on every non-tag commit. The committed file must
      # at least agree with package.json's version prefix; the tag-driven build
      # (build.yml) pins the exact form via JSPACE_BUILD_VERSION.
      - name: Version consistency (package.json ↔ cli/version.generated.ts)
        run: |
          V=$(node -p "require('./package.json').version")
          G=$(grep -o 'VERSION = "[^"]*"' cli/version.generated.ts | cut -d'"' -f2)
          case "$G" in
            "$V"|"$V"-*) : ;;
            *) echo "version mismatch: package.json=$V generated=$G (run scripts/gen-version.ts)"; exit 1 ;;
          esac

      # P3-1: docs/PLATFORMS.md quotes user-facing warning literals; this cheap
      # guard keeps them from drifting from the source (a rename here reds).
      - name: Docs↔source drift guard (doctor/cron warning literals)
        run: |
          grep -q "cron daemon not running; scheduled tasks won't fire until it starts" application/diagnostics/doctor.ts
          grep -q "crontab command not found on this system" application/diagnostics/doctor.ts
          grep -q "already succeeded today" application/automation/execute.ts
          grep -q "no such cron" application/automation/execute.ts

      - name: Scheduler argv round-trip + reconciliation smoke (pure, no real scheduler)
        run: bun test application/automation/invocation.test.ts application/automation/scheduler.test.ts adapters/harness/argv.test.ts

      # Full-chain integration on a temp workbench only: no real scheduler apply,
      # no home config, no real gbrain store, no real filehub. Each mutating step
      # asserts its output so a silent no-op (e.g. a disabled cron) turns red.
      - name: Full-chain integration (temp workbench)
        run: |
          rm -rf /tmp/jspace-verify /tmp/jspace-fh
          bun run cli/main.ts init /tmp/jspace-verify
          bun run cli/main.ts doctor --dir /tmp/jspace-verify
          bun run cli/main.ts domain add files --dir /tmp/jspace-verify
          # filehub init --register creates the domain + registers type=filehub + binds;
          # do NOT also resource-add "filehub" (filehub-path binding would collide).
          bun run cli/main.ts filehub init /tmp/jspace-fh --register --dir /tmp/jspace-verify
          mkdir -p /tmp/jspace-fh/projects/acme
          bun run cli/main.ts resource add acme --domain files --type project --path /tmp/jspace-fh/projects/acme --dir /tmp/jspace-verify
          # rehearsal: skill-target validate + argv, asserted (not a silent pass).
          # template crons ship disabled by default, so enable before the dry-run.
          bun run cli/main.ts cron enable inbox-tidy --dir /tmp/jspace-verify
          bun run cli/main.ts cron run inbox-tidy --dir /tmp/jspace-verify --dry-run | grep "dry-run: would run"
          # reconciliation plan preview (no real scheduler apply)
          bun run cli/main.ts cron install --dir /tmp/jspace-verify --dry-run | grep "would apply"
          bun run cli/main.ts cron check --dir /tmp/jspace-verify
          bun run cli/main.ts cron status --dir /tmp/jspace-verify
          bun run cli/main.ts workspace diff --dir /tmp/jspace-verify
          bun run cli/main.ts workspace upgrade --dir /tmp/jspace-verify --dry-run
