# PR/push quality gate: type-check, unit tests, generated-asset freshness,
# contract decode and temp-workbench integration. Runs on every push to main
# and every PR (independent of the tag-driven build/release matrix).
#
# Order (issue #7 P1.5): committed-manifest integrity runs BEFORE any gen-assets
# so it asserts the committed state, not the freshly-written one; the freshness
# step then proves the committed generated files are up to date. Static guards
# (version/docs/harness) precede the heavier tsc/test/python/full-chain tail.
name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    # P3 (issue #7): hard wall-clock cap (full-chain integration is the slow tail)
    # + concurrency so a superseded push cancels its in-flight PR run.
    timeout-minutes: 20
    concurrency:
      group: verify-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install deps
        run: bun install --frozen-lockfile

      # P1 (issue #7): the committed manifest's source must exist on disk AND be
      # git-tracked AND not gitignored — the issue-#6 root cause (a source lost
      # to gitignore keeps its bundle bytes until the next regen; local guards
      # pass because the file is still on disk, only a clean clone reds). Runs
      # before gen-assets so it asserts the committed manifest. The git checks
      # (ls-files / check-ignore) are the part the old inline path-exists check
      # could never catch; the fs half replaces that inline regex.
      - name: Manifest source integrity (committed; exists + tracked + not ignored)
        run: bun run scripts/check-manifest-integrity.ts

      - name: Asset freshness (gen-assets must be a no-op, incl. skills manifest)
        run: |
          bun run scripts/gen-assets.ts
          git diff --exit-code -- cli/assets.generated.ts cli/manifest.generated.ts cli/manifest.json cli/skills.generated.ts adapters/harness/capabilities.generated.ts templates/workbench/AGENTS.md

      # P1-1: catch a bumped package.json with a stale cli/version.generated.ts.
      # Not a full `gen-version && diff` — dev builds embed `git describe`'s
      # commit delta (`1.0.11-2-g…`), which legitimately differs from the
      # committed release form on every non-tag commit. The committed file must
      # at least agree with package.json's version prefix; the tag-driven build
      # (build.yml) pins the exact form via JSPACE_BUILD_VERSION.
      - name: Version consistency (package.json ↔ cli/version.generated.ts)
        run: |
          V=$(node -p "require('./package.json').version")
          G=$(grep -o 'VERSION = "[^"]*"' cli/version.generated.ts | cut -d'"' -f2)
          case "$G" in
            "$V"|"$V"-*) : ;;
            *) echo "version mismatch: package.json=$V generated=$G (run scripts/gen-version.ts)"; exit 1 ;;
          esac

      # P3-1: docs/PLATFORMS.md quotes user-facing warning literals; this cheap
      # guard keeps them from drifting from the source (a rename here reds).
      - name: Docs↔source drift guard (doctor/cron warning literals)
        run: |
          grep -rq "cron daemon not running; scheduled tasks won't fire until it starts" application/diagnostics/
          grep -rq "crontab command not found on this system" application/diagnostics/
          grep -q "already succeeded today" application/automation/execute.ts
          grep -q "no such cron" application/automation/execute.ts

      # P5: harness support surfaces (capabilities.yaml ↔ code/docs/templates)
      # must stay in sync — adding a harness but forgetting a doc/list turns red.
      - name: Harness consistency (capabilities.yaml ↔ code/docs/templates)
        run: bun run scripts/check-harness-consistency.ts

      - name: Type check
        run: bunx tsc --noEmit

      - name: Unit tests
        run: bun test

      - name: Cross-skill reference reachability
        run: bun test cli/assets-reachability.test.ts

      - name: Skill self-checks (C1–C5)
        run: bun run scripts/check-skills.ts

      - name: Office extraction tests
        run: python3 skills/asset-ingest/scripts/office-extract.test.py

      - name: Layer-routing / markitdown fallback regression
        run: python3 skills/asset-ingest/scripts/extract.test.py

      - name: Scheduler argv round-trip + reconciliation smoke (pure, no real scheduler)
        run: bun test application/automation/invocation.test.ts application/automation/scheduler.test.ts adapters/harness/argv.test.ts

      # Full-chain integration on a temp workbench only: no real scheduler apply,
      # no home config, no real gbrain store, no real filehub. Each mutating step
      # asserts its output so a silent no-op (e.g. a disabled cron) turns red.
      - name: Full-chain integration (temp workbench)
        run: |
          rm -rf /tmp/jspace-verify /tmp/jspace-fh
          bun run cli/main.ts init /tmp/jspace-verify
          bun run cli/main.ts doctor --dir /tmp/jspace-verify
          # issue #10 R4 regression: on a real (non-isolated) host the
          # sandbox-only downgrade must never fire — the daemon/crontab verdict
          # stays a real one, whatever it is (crontab_missing / daemon_stopped
          # / or ok). Only a true nested PID namespace yields unverifiable.
          OUT=$(bun run cli/main.ts doctor --dir /tmp/jspace-verify --json)
          if echo "$OUT" | grep -q "cron.daemon_unverifiable"; then echo "unexpected sandbox downgrade on real host"; exit 1; fi
          if echo "$OUT" | grep -q "cron.crontab_unverifiable"; then echo "unexpected sandbox downgrade on real host"; exit 1; fi
          bun run cli/main.ts domain add files --dir /tmp/jspace-verify
          # filehub init --register creates the domain + registers type=filehub + binds;
          # do NOT also resource-add "filehub" (filehub-path binding would collide).
          bun run cli/main.ts filehub init /tmp/jspace-fh --register --dir /tmp/jspace-verify
          mkdir -p /tmp/jspace-fh/projects/acme
          bun run cli/main.ts resource add acme --domain files --type project --path /tmp/jspace-fh/projects/acme --dir /tmp/jspace-verify
          # rehearsal: skill-target validate + argv, asserted (not a silent pass).
          # template crons ship disabled by default, so enable before the dry-run.
          bun run cli/main.ts cron enable inbox-tidy --dir /tmp/jspace-verify
          bun run cli/main.ts cron run inbox-tidy --dir /tmp/jspace-verify --dry-run | grep "dry-run: would run"
          # P2 AC7: new-harness argv assembles without a real grok binary (argv-only seam)
          bun run cli/main.ts cron run inbox-tidy --dir /tmp/jspace-verify --harness grok --dry-run | grep -- "--allow"
          # B1: tools on unsupported harness must fail loud (template crons ship tools)
          if bun run cli/main.ts cron run inbox-tidy --dir /tmp/jspace-verify --harness opencode --dry-run 2>&1 | grep -q "does not support --tools"; then :; else echo "expected tools unsupported fail for opencode override"; exit 1; fi
          # P0 (issue #7): opencode argv includes the `run` subcommand (capability
          # headless prefix) — assert on a tools-free cron so B1 guard does not fire
          bun run cli/main.ts cron add opencode-argv-probe --schedule "0 0 * * *" --harness opencode --prompt "probe" --dir /tmp/jspace-verify
          bun run cli/main.ts cron run opencode-argv-probe --dir /tmp/jspace-verify --dry-run | grep -- "opencode run"
          # reconciliation plan preview (no real scheduler apply)
          bun run cli/main.ts cron install --dir /tmp/jspace-verify --dry-run | grep "would apply"
          bun run cli/main.ts cron check --dir /tmp/jspace-verify
          bun run cli/main.ts cron status --dir /tmp/jspace-verify
          bun run cli/main.ts workspace diff --dir /tmp/jspace-verify
          bun run cli/main.ts workspace upgrade --dir /tmp/jspace-verify --dry-run

      # NOTE (issue #10): an end-to-end sandbox doctor regression (nested PID
      # namespace -> unverifiable downgrade) was attempted via `unshare --user
      # --map-root-user --pid`, but GitHub Actions runners forbid unprivileged
      # user namespaces (`write failed /proc/self/uid_map: Operation not
      # permitted`) — the step cannot run in CI. The downgrade logic is covered
      # by unit tests (pidNamespaceIsolated + health() tri-state branches); the
      # real-host non-downgrade is asserted above; final sandbox verification
      # must happen on a real host (e.g. WSL2 + Codex sandbox).

